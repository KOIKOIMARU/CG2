name: CheckUnwantedFiles

on:
  # 手動実行できるようにする
  workflow_dispatch:
  # master ブランチへの push でも実行
  push:
    branches:
      - master

env:
  # 不要なファイル名・拡張子のパターン（スペース区切り）
  UNWANTED_NAME_PATTERNS: >
    *.pdb *.ilk *.user *.ncb
    *.suo *.log *.dmp *.zip
    imgui.ini desktop.ini
    dxcompiler.dll dxil.dll

  # 不要なディレクトリ名のパターン
  UNWANTED_DIR_PATTERNS: >
    generated x64 win32 arm64 .vs
    bin ipch logs Dump

jobs:
  check-files:
    name: 不要なファイルを検索
    runs-on: ubuntu-latest

    steps:
      # リポジトリをチェックアウト
      - name: リポジトリをチェックアウト
        uses: actions/checkout@v4

      # 不要ファイル・ディレクトリ検索
      - name: 不要なファイルとディレクトリを検索（bash）
        run: |
          # ディレクトリ条件を構築
          DIR_CONDITIONS=()
          for pattern in $UNWANTED_DIR_PATTERNS; do
            DIR_CONDITIONS+=(-o -iname "$pattern")
          done
          unset DIR_CONDITIONS[0]

          # ファイル条件を構築
          NAME_CONDITIONS=()
          for pattern in $UNWANTED_NAME_PATTERNS; do
            NAME_CONDITIONS+=(-o -iname "$pattern")
          done
          unset NAME_CONDITIONS[0]

          # find 実行
          UNWANTED_LIST=$(find . \
            -path "./.git" -prune \
            -o \( "${DIR_CONDITIONS[@]}" \) -a -type d -print -prune \
            -o \( "${NAME_CONDITIONS[@]}" \) -a -type f -print)

          # 結果判定
          if [ -n "$UNWANTED_LIST" ]; then
            echo "::error::不要なファイルまたはディレクトリが見つかりました！"
            echo "$UNWANTED_LIST"
            exit 1
          fi

          echo "リポジトリはクリーンです。"
